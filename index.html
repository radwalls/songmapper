<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Mapper Desktop Prototype</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171b24;
      --panel-2: #1f2533;
      --line: #313a4f;
      --text: #eff3ff;
      --muted: #a7b1c8;
      --accent: #78f0c2;
      --accent-soft: rgba(120, 240, 194, 0.2);
      --above: #9ed8ff;
      --below: #ffc56e;
      --warn: #ff8b8b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #141a28 0, var(--bg) 38%);
      color: var(--text);
      font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      min-width: 0;
    }

    .app {
      width: min(1400px, 100vw - 20px);
      margin: 0 auto;
      padding: 18px;
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }

    .header {
      padding: 14px;
      display: grid;
      gap: 6px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 900;
    }

    .header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .composer {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .composer.collapsed textarea,
    .composer.collapsed .generate-row {
      display: none;
    }

    .topbar {
      display: none;
      gap: 8px;
      align-items: center;
      grid-template-columns: auto auto auto 1fr;
    }

    .composer.collapsed .topbar {
      display: grid;
    }

    .song-label {
      justify-self: end;
      color: var(--muted);
      border: 1px solid #3c455d;
      border-radius: 8px;
      background: #151b28;
      padding: 8px 10px;
      min-width: 220px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      border-radius: 10px;
      border: 1px solid #3f4a63;
      background: #111623;
      color: var(--text);
      padding: 12px;
      font: 500 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      resize: vertical;
    }

    .generate-row {
      display: flex;
      gap: 8px;
    }

    button,
    select,
    input[type="text"],
    input[type="number"] {
      border-radius: 10px;
      border: 1px solid #414b63;
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      padding: 9px 11px;
    }

    button {
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    .danger {
      border-color: #5d3a47;
      color: var(--warn);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(280px, 30vw, 360px);
      gap: 12px;
      align-items: start;
    }

    .map-wrap {
      padding: 14px;
      min-height: 560px;
      overflow: hidden;
    }

    #map {
      min-height: 500px;
      display: grid;
      gap: 10px;
      overflow-x: auto;
    }

    .empty-state {
      padding: 24px;
      border: 1px dashed #3a435a;
      border-radius: 10px;
      text-align: center;
      color: var(--muted);
    }

    .line-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      padding: 4px;
      border-radius: 10px;
    }

    .line-row:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .line-handle {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 12px;
      background: #141a27;
      border: 1px solid #374058;
      color: var(--muted);
      padding: 0;
    }

    .line-handle.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .line-words {
      position: relative;
      padding: 2px;
      min-height: 48px;
      overflow: hidden;
    }

    .line-flow {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: nowrap;
      align-items: flex-start;
      gap: 6px;
      min-height: 48px;
      width: max-content;
      min-width: 100%;
    }

    .pitch-line-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 3;
    }

    .pitch-path {
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 2px rgba(95, 220, 255, 0.25));
    }

    .pitch-point { fill: #9bf3ff; stroke: #042430; stroke-width: 1; cursor: pointer; }
    .pitch-point.selected { fill: #ffe667; }
    .pitch-label { fill: #b7e9ff; font-size: 10px; opacity: 0.75; }

    .pitch-path.soft {
      opacity: 0.52;
    }

    .pitch-path.strong {
      opacity: 0.96;
    }

    .breath-block {
      position: relative;
      border: 1px solid #9ef5ff;
      background: rgba(158, 245, 255, 0.2);
      color: #d8fbff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
    }

    .breath-block::after {
      content: attr(data-type);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 100%;
      margin-top: 2px;
      font-size: 9px;
      color: #a6dbe3;
      white-space: nowrap;
    }

    .breath-block.micro { width: 10px; height: 18px; }
    .breath-block.quick { width: 14px; height: 20px; }
    .breath-block.normal { width: 18px; height: 22px; }
    .breath-block.deep { width: 24px; height: 24px; }
    .breath-block.maximum { width: 30px; height: 28px; border-width: 2px; }

    .line-break {
      height: 14px;
      margin-left: 42px;
      border-top: 1px dashed #2f3750;
      opacity: 0.8;
    }

    .word-card {
      position: relative;
      z-index: 2;
      border: 1px solid #3a4359;
      background: linear-gradient(180deg, #1b2332 0%, #171e2b 100%);
      color: var(--text);
      border-radius: 10px;
      min-width: 78px;
      max-width: 190px;
      padding: 6px 8px 8px;
      display: grid;
      grid-template-rows: 22px auto 20px 16px;
      gap: 4px;
      user-select: none;
    }

    .word-card:hover {
      border-color: #58627d;
      transform: translateY(-1px);
    }

    .word-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
      background: linear-gradient(180deg, #203243, #1b2534);
    }

    .annotation {
      min-height: 20px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.15;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2px;
      overflow-wrap: anywhere;
    }

    .annotation.above {
      color: var(--above);
      border: 1px dashed rgba(158, 216, 255, 0.35);
      background: rgba(158, 216, 255, 0.08);
    }

    .annotation.below {
      color: var(--below);
      border: 1px dashed rgba(255, 197, 110, 0.35);
      background: rgba(255, 197, 110, 0.08);
    }

    .word {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .meta { display: none; }

    .side-panel {
      position: sticky;
      top: 12px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .selection-block {
      border: 1px solid #363f57;
      border-radius: 10px;
      background: #141a27;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .selection-title {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .selection-main {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent);
    }

    .mode-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-toggle.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent-soft);
    }

    .group {
      border-top: 1px solid #353e55;
      padding-top: 10px;
      display: grid;
      gap: 7px;
    }

    .group label {
      font-size: 12px;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 1200px) {
      .workspace { grid-template-columns: 1fr; }
      .side-panel { position: static; }
    }

    #exportBox {
      padding: 12px;
      margin: 0;
      min-height: 120px;
      white-space: pre-wrap;
      color: #d5def0;
      font: 500 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card header">
      <h1>Song Mapper (Desktop)</h1>
      <p>Fast desktop lyric markup: multi-select words, batch apply attributes, and draw enunciation/pitch with your mouse.</p>
    </section>

    <section id="composer" class="card composer">
      <textarea id="lyricsInput" placeholder="Paste lyrics here..."></textarea>
      <div class="generate-row">
        <button id="generateBtn">Generate Song Map</button>
      </div>

      <div class="topbar">
        <button id="editLyricsBtn">Edit Lyrics</button>
        <button id="exportBtn">Export Map</button>
        <button id="clearMapBtn" class="danger">Clear Map</button>
        <input id="songTitle" class="song-label" type="text" placeholder="Song title / practice label" />
      </div>
    </section>

    <section class="workspace">
      <section class="card map-wrap">
        <div id="map">
          <div class="empty-state">Paste lyrics and click “Generate Song Map”.</div>
        </div>
      </section>

      <aside class="card side-panel">
        <div class="selection-block">
          <div class="selection-title">Selection</div>
          <div id="selectedSummary" class="selection-main">0 words selected</div>
          <div id="selectedWordName" class="selection-title">No word selected</div>
        </div>

        <div class="mode-row">
          <button id="enuncModeBtn" class="mode-toggle">Enunciation Draw</button>
          <button id="pitchModeBtn" class="mode-toggle">Pitch Draw</button>
          <button id="breathModeBtn" class="mode-toggle">Breath Tool</button>
          <button id="volumeModeBtn" class="mode-toggle">Volume Paint</button>
        </div>

        <div class="group">
          <label for="aboveSelect">Vocal mode / tone (above)</label>
          <div class="row">
            <select id="aboveSelect">
              <option value="">None</option>
              <option>full voice clean</option>
              <option>mixed voice</option>
              <option>falsetto</option>
              <option>breathy</option>
              <option>grit</option>
              <option>power scream</option>
              <option>growl</option>
              <option>tiny singing</option>
              <option>belt</option>
              <option>soft palate buzz</option>
              <option>open vowel</option>
            </select>
            <button id="applyAbovePresetBtn">Apply</button>
          </div>
          <div class="row">
            <input id="customAbove" type="text" placeholder="Custom above note..." />
            <button id="applyCustomAboveBtn">Apply</button>
          </div>
        </div>

        <div class="group">
          <label for="belowSelect">Performance instruction (below)</label>
          <div class="row">
            <select id="belowSelect">
              <option value="">None</option>
              <option>support down</option>
              <option>drop jaw</option>
              <option>breathe</option>
              <option>lean in</option>
              <option>clear consonants</option>
              <option>punch word</option>
              <option>hold back</option>
              <option>explode</option>
              <option>taper off</option>
              <option>drag timing</option>
              <option>push timing</option>
              <option>palate buzz</option>
            </select>
            <button id="applyBelowPresetBtn">Apply</button>
          </div>
          <div class="row">
            <input id="customBelow" type="text" placeholder="Custom below note..." />
            <button id="applyCustomBelowBtn">Apply</button>
          </div>
        </div>

        <div class="group">
          <label for="breathTypeSelect">Breath type (click to insert, drag to move)</label>
          <select id="breathTypeSelect">
            <option value="micro">micro breath</option>
            <option value="quick">quick breath</option>
            <option value="normal" selected>normal breath</option>
            <option value="deep">deep breath</option>
            <option value="maximum">maximum breath potential</option>
          </select>
        </div>

        <div class="group">
          <label for="editWordInput">Edit selected word text (single selection)</label>
          <div class="row">
            <input id="editWordInput" type="text" placeholder="Correct typo..." />
            <button id="applyWordEditBtn">Update</button>
          </div>
        </div>

        <div class="group">
          <button id="clearSelectedBtn" class="danger">Clear Selected Markings</button>
        </div>
      </aside>
    </section>

    <pre id="exportBox" class="card">Nothing exported yet.</pre>
  </main>

  <script>
    (function () {
      const composer = document.getElementById("composer");
      const lyricsInput = document.getElementById("lyricsInput");
      const generateBtn = document.getElementById("generateBtn");
      const editLyricsBtn = document.getElementById("editLyricsBtn");
      const exportBtn = document.getElementById("exportBtn");
      const clearMapBtn = document.getElementById("clearMapBtn");
      const map = document.getElementById("map");
      const exportBox = document.getElementById("exportBox");
      const selectedSummary = document.getElementById("selectedSummary");
      const selectedWordName = document.getElementById("selectedWordName");
      const editWordInput = document.getElementById("editWordInput");

      const aboveSelect = document.getElementById("aboveSelect");
      const belowSelect = document.getElementById("belowSelect");
      const customAbove = document.getElementById("customAbove");
      const customBelow = document.getElementById("customBelow");
      const breathTypeSelect = document.getElementById("breathTypeSelect");

      const enuncModeBtn = document.getElementById("enuncModeBtn");
      const pitchModeBtn = document.getElementById("pitchModeBtn");
      const breathModeBtn = document.getElementById("breathModeBtn");
      const volumeModeBtn = document.getElementById("volumeModeBtn");

      let words = [];
      let lines = [];
      let selectedIndices = new Set();
      let lastSelectedIndex = null;
      let lastLineSelected = null;
      let drawMode = null;
      let isDrawing = false;
      let breathSeed = 0;
      let pitchPointSeed = 0;
      let showPitchPoints = true;
      let activePitchDrag = null;
      let activeBreathDrag = null;

      function normalizeLyrics(text) { return text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n"); }
      function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
      function mmToPx(mm) { return mm * 3.78; }

      function createStop(offset, color) {
        const stop = document.createElementNS("http://www.w3.org/2000/svg", "stop");
        stop.setAttribute("offset", offset);
        stop.setAttribute("stop-color", color);
        return stop;
      }

      function makeWordData(text, index, lineIndex) {
        return { index, lineIndex, text, above: "", below: "", volume: null, enunciation: 50, letterLevels: [], pitch: 50, card: null, aboveNode: null, belowNode: null, wordNode: null };
      }

      function clearModel() {
        words = []; lines = []; selectedIndices = new Set(); lastSelectedIndex = null; lastLineSelected = null;
      }

      function renderEmpty(message) {
        map.innerHTML = "";
        const empty = document.createElement("div"); empty.className = "empty-state"; empty.textContent = message; map.appendChild(empty);
      }

      function generateMap() {
        clearModel(); exportBox.textContent = "Nothing exported yet.";
        const raw = lyricsInput.value;
        if (!raw.trim()) { renderEmpty("Paste lyrics and click “Generate Song Map”."); return; }
        map.innerHTML = "";
        let globalIndex = 0;

        normalizeLyrics(raw).forEach(function (lineText, lineIndex) {
          if (!lineText.trim()) { const br = document.createElement("div"); br.className = "line-break"; map.appendChild(br); lines.push({ lineIndex, wordIndices: [], raw: "" }); return; }

          const row = document.createElement("div"); row.className = "line-row";
          const handle = document.createElement("button"); handle.type = "button"; handle.className = "line-handle"; handle.textContent = String(lineIndex + 1);
          const wordsWrap = document.createElement("div"); wordsWrap.className = "line-words";
          const flow = document.createElement("div"); flow.className = "line-flow";

          const pitchSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); pitchSvg.classList.add("pitch-line-layer");
          const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
          const gradient = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");
          const gid = "pitch-gradient-" + lineIndex + "-" + Date.now();
          gradient.setAttribute("id", gid); gradient.setAttribute("x1", "0%"); gradient.setAttribute("y1", "100%"); gradient.setAttribute("x2", "0%"); gradient.setAttribute("y2", "0%");
          gradient.appendChild(createStop("0%", "#4b7bff")); gradient.appendChild(createStop("50%", "#67dfff")); gradient.appendChild(createStop("100%", "#ffe667"));
          defs.appendChild(gradient);
          const soft = document.createElementNS("http://www.w3.org/2000/svg", "path"); soft.classList.add("pitch-path", "soft"); soft.setAttribute("stroke", "url(#" + gid + ")");
          const strong = document.createElementNS("http://www.w3.org/2000/svg", "path"); strong.classList.add("pitch-path", "strong"); strong.setAttribute("stroke", "url(#" + gid + ")");
          const pointsGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
          pitchSvg.append(defs, soft, strong, pointsGroup);

          const wordIndices = [];
          lineText.trim().split(/\s+/).forEach(function (wordText) {
            const data = makeWordData(wordText, globalIndex, lineIndex);
            const card = createWordCard(data);
            data.card = card;
            words.push(data); wordIndices.push(globalIndex); flow.appendChild(card); globalIndex += 1;
          });

          handle.addEventListener("click", function (event) { handleLineSelection(lineIndex, event); });
          wordsWrap.addEventListener("mousedown", function (event) { handleWrapMouseDown(event, lineIndex); });
          wordsWrap.addEventListener("contextmenu", function (event) { if (drawMode === "pitch") event.preventDefault(); });

          wordsWrap.append(pitchSvg, flow);
          row.append(handle, wordsWrap); map.appendChild(row);
          lines.push({ lineIndex, wordIndices, handle, raw: lineText, wordsWrap, flow, pitchSvg, pitchSoft: soft, pitchStrong: strong, pointsGroup, breaths: [], pitchPoints: [] });
        });

        composer.classList.add("collapsed");
        addPitchToggleControl();
        updateSelectionUI();
        renderAllLineFlows();
        redrawAllPitchLines();
      }

      function addPitchToggleControl() {
        if (document.getElementById("togglePitchPointsBtn")) return;
        const group = document.createElement("div"); group.className = "group";
        group.innerHTML = '<button id="togglePitchPointsBtn">Hide Pitch Points</button>';
        document.querySelector('.side-panel').appendChild(group);
        document.getElementById('togglePitchPointsBtn').addEventListener('click', function () {
          showPitchPoints = !showPitchPoints;
          this.textContent = showPitchPoints ? 'Hide Pitch Points' : 'Show Pitch Points';
          redrawAllPitchLines();
        });
      }

      function createWordCard(wordData) {
        const card = document.createElement("div"); card.className = "word-card"; card.dataset.index = String(wordData.index);
        const above = document.createElement("div"); above.className = "annotation above"; above.textContent = " ";
        const wordNode = document.createElement("div"); wordNode.className = "word";
        const below = document.createElement("div"); below.className = "annotation below"; below.textContent = " ";
        const meta = document.createElement("div"); meta.className = "meta";
        card.append(above, wordNode, below, meta);
        wordData.aboveNode = above; wordData.belowNode = below; wordData.wordNode = wordNode;
        applyWordVisual(wordData);

        card.addEventListener("click", function (event) { handleWordSelection(wordData.index, event); });
        card.addEventListener("mousedown", function (event) {
          if (event.button !== 0 || !drawMode || drawMode === "breath" || drawMode === "pitch") return;
          isDrawing = true; applyDrawAtPoint(wordData.index, event.clientX, event.clientY); event.preventDefault();
        });
        card.addEventListener("mousemove", function (event) {
          if (!isDrawing || !drawMode || drawMode === "breath" || drawMode === "pitch") return;
          applyDrawAtPoint(wordData.index, event.clientX, event.clientY);
        });
        card.addEventListener("dblclick", function () { selectOnly(wordData.index); editWordInput.value = wordData.text; editWordInput.focus(); editWordInput.select(); });
        return card;
      }

      function handleWrapMouseDown(event, lineIndex) {
        const line = lines.find(function (l) { return l.lineIndex === lineIndex; });
        if (!line) return;
        if (drawMode === 'breath' && event.button === 0) {
          const b = event.target.closest('.breath-block');
          if (b) { activeBreathDrag = { lineIndex, breathId: b.dataset.id }; return; }
          insertBreathAtPoint(line, event.clientX); event.preventDefault(); return;
        }
        if (drawMode !== 'pitch') return;
        event.preventDefault();
        const pt = event.target.closest('.pitch-point');
        if (event.button === 2 || event.ctrlKey || event.metaKey) { if (pt) removePitchPoint(line, pt.dataset.id); return; }
        if (pt) {
          line.selectedPitchPointId = pt.dataset.id;
          activePitchDrag = { lineIndex, pointId: pt.dataset.id };
          redrawPitchLine(lineIndex);
          return;
        }
        addPitchPoint(line, event.clientX, event.clientY);
      }

      function handleWordSelection(index, event) {
        const isMultiToggle = event.ctrlKey || event.metaKey; const isRange = event.shiftKey;
        if (isRange && lastSelectedIndex !== null) {
          const pair = [lastSelectedIndex, index].sort(function (a, b) { return a - b; }); if (!isMultiToggle) selectedIndices.clear(); for (let i = pair[0]; i <= pair[1]; i += 1) selectedIndices.add(i);
        } else if (isMultiToggle) { if (selectedIndices.has(index)) selectedIndices.delete(index); else selectedIndices.add(index); lastSelectedIndex = index; }
        else selectOnly(index);
        if (isRange) lastSelectedIndex = index; updateSelectionUI();
      }

      function handleLineSelection(lineIndex, event) {
        const line = lines.find(function (item) { return item.lineIndex === lineIndex; }); if (!line || !line.wordIndices.length) return;
        const isShift = event.shiftKey; const isMulti = event.ctrlKey || event.metaKey;
        if (isShift && lastLineSelected !== null) {
          const pair = [lastLineSelected, lineIndex].sort(function (a, b) { return a - b; }); if (!isMulti) selectedIndices.clear();
          lines.forEach(function (item) { if (item.lineIndex < pair[0] || item.lineIndex > pair[1]) return; item.wordIndices.forEach(function (idx) { selectedIndices.add(idx); }); });
        } else {
          if (!isMulti) selectedIndices.clear();
          line.wordIndices.forEach(function (idx) { if (isMulti && selectedIndices.has(idx)) selectedIndices.delete(idx); else selectedIndices.add(idx); });
        }
        lastLineSelected = lineIndex; lastSelectedIndex = line.wordIndices[line.wordIndices.length - 1]; updateSelectionUI();
      }

      function selectOnly(index) { selectedIndices.clear(); selectedIndices.add(index); lastSelectedIndex = index; }
      function updateSelectionUI() {
        words.forEach(function (word) { word.card.classList.toggle("selected", selectedIndices.has(word.index)); });
        lines.forEach(function (line) { if (!line.handle || !line.wordIndices.length) return; const allSelected = line.wordIndices.every(function (idx) { return selectedIndices.has(idx); }); line.handle.classList.toggle("active", allSelected); });
        const count = selectedIndices.size;
        if (count === 0) { selectedSummary.textContent = "0 words selected"; selectedWordName.textContent = "No word selected"; editWordInput.value = ""; return; }
        if (count === 1) { const w = words[Array.from(selectedIndices)[0]]; selectedSummary.textContent = "1 word selected"; selectedWordName.textContent = "Word: " + w.text; editWordInput.value = w.text; return; }
        selectedSummary.textContent = String(count) + " words selected"; selectedWordName.textContent = "Batch edit active"; editWordInput.value = "";
      }

      function applyToSelected(fn) { if (!selectedIndices.size) return; selectedIndices.forEach(function (idx) { const w = words[idx]; if (!w) return; fn(w); applyWordVisual(w); }); updateSelectionUI(); }

      function applyWordVisual(word) {
        word.aboveNode.textContent = word.above || " "; word.belowNode.textContent = word.below || " ";
        normalizeLetterLevels(word); renderWordLetters(word);
        if (word.volume == null) word.card.style.background = "linear-gradient(180deg, #1b2332 0%, #171e2b 100%)";
        else {
          const vol = clamp(Math.round(word.volume), 1, 10);
          word.card.style.background = "linear-gradient(180deg, " + volumeColor(vol) + "33 0%, #171e2b 90%)";
        }
        redrawPitchLine(word.lineIndex);
      }

      function setDrawMode(mode) {
        drawMode = drawMode === mode ? null : mode;
        enuncModeBtn.classList.toggle("active", drawMode === "enunciation");
        pitchModeBtn.classList.toggle("active", drawMode === "pitch");
        breathModeBtn.classList.toggle("active", drawMode === "breath");
        volumeModeBtn.classList.toggle("active", drawMode === "volume");
      }

      function applyDrawAtPoint(index, clientX, clientY) {
        const w = words[index]; if (!w || !w.card) return;
        const rect = w.card.getBoundingClientRect(); const ratio = clamp((clientY - rect.top) / rect.height, 0, 1); const value = Math.round((1 - ratio) * 100);
        if (drawMode === "enunciation") paintLetterLevels(w, clientX, value);
        else if (drawMode === "volume") w.volume = clamp(Math.round((value / 100) * 9 + 1), 1, 10);
        applyWordVisual(w);
      }

      function normalizeLetterLevels(word) {
        const len = word.text.length; if (!len) { word.letterLevels = []; word.enunciation = 50; return; }
        if (!Array.isArray(word.letterLevels) || word.letterLevels.length !== len) word.letterLevels = Array.from({ length: len }, function () { return clamp(word.enunciation, 0, 100); });
      }
      function renderWordLetters(word) {
        word.wordNode.innerHTML = ""; if (!word.text.length) return; let total = 0;
        Array.from(word.text).forEach(function (char, idx) {
          const level = clamp(word.letterLevels[idx], 0, 100); total += level;
          const span = document.createElement("span"); span.style.display = "inline-block";
          let renderedChar = char, fontSize = 18, fontWeight = 700, opacity = 0.9;
          if (level < 35) { renderedChar = char.toLowerCase(); fontSize = 16; fontWeight = 600; opacity = 0.72; }
          else if (level > 70) { renderedChar = char.toUpperCase(); fontSize = 20; fontWeight = 900; opacity = 1; }
          span.textContent = renderedChar; span.style.fontSize = String(fontSize) + "px"; span.style.fontWeight = String(fontWeight); span.style.opacity = String(opacity); word.wordNode.appendChild(span);
        });
        word.enunciation = Math.round(total / word.text.length);
      }
      function paintLetterLevels(word, clientX, value) {
        normalizeLetterLevels(word); const textRect = word.wordNode.getBoundingClientRect(); const ratioX = clamp((clientX - textRect.left) / Math.max(textRect.width, 1), 0, 1); const center = Math.round(ratioX * (word.text.length - 1));
        word.letterLevels = word.letterLevels.map(function (existing, idx) { const dist = Math.abs(idx - center); const influence = Math.max(0, 1 - dist / 2.2); if (influence <= 0) return existing; return Math.round(existing * (1 - influence) + value * influence); });
      }

      function addPitchPoint(line, clientX, clientY) {
        const rect = line.flow.getBoundingClientRect();
        const localX = clamp(clientX - rect.left, 0, rect.width);
        const localY = clamp(clientY - rect.top, 0, rect.height);
        const minDist = mmToPx(1);
        if (line.pitchPoints.some(function (p) { const dx = p.x * rect.width - localX; const dy = p.y * rect.height - localY; return Math.sqrt(dx * dx + dy * dy) < minDist; })) return;
        const wordIdx = findNearestWordIndex(line, localX, rect);
        if (wordIdx == null) return;
        const point = { id: 'p-' + (++pitchPointSeed), x: localX / rect.width, y: localY / rect.height, wordIndex: wordIdx };
        line.pitchPoints.push(point);
        line.pitchPoints.sort(function (a, b) { return a.x - b.x; });
        line.selectedPitchPointId = point.id;
        syncWordPitchFromPoints(line);
        redrawPitchLine(line.lineIndex);
      }

      function removePitchPoint(line, pointId) {
        line.pitchPoints = line.pitchPoints.filter(function (p) { return p.id !== pointId; });
        if (line.selectedPitchPointId === pointId) line.selectedPitchPointId = null;
        syncWordPitchFromPoints(line); redrawPitchLine(line.lineIndex);
      }

      function findNearestWordIndex(line, localX, rect) {
        let nearest = null;
        line.wordIndices.forEach(function (idx) {
          const card = words[idx].card.getBoundingClientRect();
          const center = (card.left - rect.left) + card.width / 2;
          const dist = Math.abs(center - localX);
          if (!nearest || dist < nearest.dist) nearest = { idx, dist };
        });
        return nearest ? nearest.idx : null;
      }

      function syncWordPitchFromPoints(line) {
        line.wordIndices.forEach(function (idx) {
          const related = line.pitchPoints.filter(function (p) { return p.wordIndex === idx; });
          if (!related.length) return;
          const avg = related.reduce(function (s, p) { return s + (100 - p.y * 100); }, 0) / related.length;
          words[idx].pitch = clamp(Math.round(avg), 0, 100);
        });
      }

      function redrawAllPitchLines() { lines.forEach(function (line) { redrawPitchLine(line.lineIndex); }); }
      function redrawPitchLine(lineIndex) {
        const line = lines.find(function (item) { return item.lineIndex === lineIndex; });
        if (!line || !line.pitchSoft || !line.pitchStrong || !line.flow || !line.wordIndices.length) return;
        const rect = line.flow.getBoundingClientRect(); const width = Math.max(1, rect.width); const height = Math.max(1, rect.height);
        line.pitchSvg.setAttribute('viewBox', '0 0 ' + width + ' ' + height); line.pitchSvg.setAttribute('preserveAspectRatio', 'none');
        line.pitchSvg.style.clipPath = 'inset(0 0 0 0)';

        const points = (line.pitchPoints.length ? line.pitchPoints : line.wordIndices.map(function (idx) {
          const card = words[idx].card.getBoundingClientRect();
          return { id: 'w-' + idx, x: ((card.left - rect.left) + card.width / 2) / width, y: clamp(1 - words[idx].pitch / 100, 0, 1), wordIndex: idx };
        })).filter(function (p) { return words[p.wordIndex] && words[p.wordIndex].lineIndex === lineIndex; })
          .sort(function (a, b) { return a.x - b.x; });

        if (!points.length) { line.pitchSoft.setAttribute('d', ''); line.pitchStrong.setAttribute('d', ''); line.pointsGroup.innerHTML = ''; return; }
        const mapped = points.map(function (p) { return { x: p.x * width, y: p.y * height, id: p.id, wordIndex: p.wordIndex }; });
        let d = 'M 0 ' + mapped[0].y + ' L ' + mapped[0].x + ' ' + mapped[0].y;
        for (let i = 1; i < mapped.length; i += 1) {
          const prev = mapped[i - 1]; const curr = mapped[i];
          if (words[prev.wordIndex].lineIndex !== words[curr.wordIndex].lineIndex) continue;
          d += ' L ' + curr.x + ' ' + prev.y + ' L ' + curr.x + ' ' + curr.y;
        }
        d += ' L ' + width + ' ' + mapped[mapped.length - 1].y;
        line.pitchSoft.setAttribute('d', d); line.pitchStrong.setAttribute('d', d);

        line.pointsGroup.innerHTML = '';
        if (!showPitchPoints || drawMode !== 'pitch') return;
        mapped.forEach(function (p) {
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', String(p.x)); c.setAttribute('cy', String(p.y)); c.setAttribute('r', '4'); c.setAttribute('data-id', p.id); c.setAttribute('class', 'pitch-point' + (line.selectedPitchPointId === p.id ? ' selected' : ''));
          const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          t.setAttribute('x', String(p.x + 5)); t.setAttribute('y', String(Math.max(10, p.y - 6))); t.setAttribute('class', 'pitch-label'); t.textContent = pitchLabelFromY(p.y / height);
          line.pointsGroup.append(c, t);
        });
      }

      function pitchLabelFromY(normY) {
        const notes = ['B','A','G','F','E','D','C'];
        return notes[clamp(Math.round(normY * (notes.length - 1)),0,notes.length-1)];
      }

      function insertBreathAtPoint(line, clientX) {
        const rect = line.flow.getBoundingClientRect();
        const localX = clamp(clientX - rect.left, 0, rect.width);
        const slot = findBreathSlot(line, localX, rect);
        const breath = { id: 'b-' + (++breathSeed), type: breathTypeSelect.value || 'normal', slot: slot };
        line.breaths.push(breath);
        renderLineFlow(line);
      }

      function findBreathSlot(line, localX, rect) {
        const centers = line.wordIndices.map(function (idx) { const r = words[idx].card.getBoundingClientRect(); return (r.left - rect.left) + r.width / 2; });
        let slot = 0;
        while (slot < centers.length && localX > centers[slot]) slot += 1;
        return slot;
      }

      function renderLineFlow(line) {
        if (!line || !line.flow) return;
        line.flow.innerHTML = '';
        const grouped = {};
        line.breaths.forEach(function (b) { if (!grouped[b.slot]) grouped[b.slot] = []; grouped[b.slot].push(b); });
        for (let i = 0; i <= line.wordIndices.length; i += 1) {
          (grouped[i] || []).forEach(function (breath) {
            const block = document.createElement('button'); block.type = 'button'; block.className = 'breath-block ' + breath.type; block.dataset.type = breath.type; block.dataset.id = breath.id; block.textContent = '▢';
            block.addEventListener('click', function (event) {
              event.preventDefault(); event.stopPropagation();
              const current = ['micro','quick','normal','deep','maximum'];
              if (event.ctrlKey || event.metaKey || event.button === 2) line.breaths = line.breaths.filter(function (b) { return b.id !== breath.id; });
              else breath.type = current[(current.indexOf(breath.type) + 1) % current.length];
              renderLineFlow(line);
            });
            line.flow.appendChild(block);
          });
          if (i < line.wordIndices.length) line.flow.appendChild(words[line.wordIndices[i]].card);
        }
        redrawPitchLine(line.lineIndex);
      }

      function renderAllLineFlows() { lines.forEach(function (line) { if (line.wordIndices && line.wordIndices.length) renderLineFlow(line); }); }

      function applyAboveValue(value) { const normalized = (value || "").trim(); applyToSelected(function (w) { w.above = normalized; }); }
      function applyBelowValue(value) { const normalized = (value || "").trim(); applyToSelected(function (w) { w.below = normalized; }); }
      function volumeColor(volume) { const hue = 210 - ((volume - 1) / 9) * 195; return "hsl(" + hue + " 88% 58%)"; }

      function clearSelectedMarkings() {
        applyToSelected(function (w) { w.above = ""; w.below = ""; w.volume = null; w.enunciation = 50; w.letterLevels = Array.from({ length: w.text.length }, function () { return 50; }); w.pitch = 50; });
        lines.forEach(function (line) { line.pitchPoints = []; line.selectedPitchPointId = null; });
        redrawAllPitchLines();
      }

      function applyWordEdit() {
        if (selectedIndices.size !== 1) return;
        const value = editWordInput.value.trim(); if (!value) return;
        const w = words[Array.from(selectedIndices)[0]]; if (!w) return;
        w.text = value; w.letterLevels = Array.from({ length: w.text.length }, function () { return w.enunciation; }); applyWordVisual(w); updateSelectionUI();
      }
      function editLyrics() { composer.classList.remove("collapsed"); }
      function clearMap() {
        clearModel(); drawMode = null; [enuncModeBtn,pitchModeBtn,breathModeBtn,volumeModeBtn].forEach(function (b) { b.classList.remove('active'); });
        lyricsInput.value = ""; composer.classList.remove("collapsed"); exportBox.textContent = "Nothing exported yet."; renderEmpty("Paste lyrics and click “Generate Song Map”."); updateSelectionUI();
      }

      function exportMap() {
        if (!words.length) { exportBox.textContent = "Nothing to export yet."; return; }
        const chunks = [];
        lines.forEach(function (line) {
          if (!line.wordIndices.length) { chunks.push(""); return; }
          const lineWords = line.wordIndices.map(function (idx) { return words[idx]; });
          const above = lineWords.map(function (w) { return w.above || "-"; }).join(" | ");
          const lyric = lineWords.map(function (w) { return w.text; }).join(" ");
          const below = lineWords.map(function (w) { return w.below || "-"; }).join(" | ");
          const volume = lineWords.map(function (w) { return w.volume == null ? "-" : String(Math.round(w.volume)); }).join(" | ");
          const enunciation = lineWords.map(function (w) { return String(Math.round(w.enunciation)); }).join(" | ");
          const pitch = lineWords.map(function (w) { return String(Math.round(w.pitch)); }).join(" | ");
          const breaths = (line.breaths || []).slice().sort(function (a, b) { return a.slot - b.slot; }).map(function (b) { return b.type; }).join(" | ") || "-";
          chunks.push(
            "ABOVE:\n" + above + "\n\n" +
            "LYRIC:\n" + lyric + "\n\n" +
            "BELOW:\n" + below + "\n\n" +
            "VOLUME:\n" + volume + "\n\n" +
            "ENUNCIATION:\n" + enunciation + "\n\n" +
            "PITCH RANGE:\n" + pitch + "\n\n" +
            "BREATHS:\n" + breaths + "\n"
          );
        });
        exportBox.textContent = chunks.join("\n").trim() || "Nothing to export yet.";
      }

      document.addEventListener("mouseup", function () { isDrawing = false; activePitchDrag = null; activeBreathDrag = null; });
      document.addEventListener('mousemove', function (event) {
        if (activePitchDrag && drawMode === 'pitch') {
          const line = lines.find(function (l) { return l.lineIndex === activePitchDrag.lineIndex; });
          const point = line && line.pitchPoints.find(function (p) { return p.id === activePitchDrag.pointId; });
          if (!line || !point) return;
          const rect = line.flow.getBoundingClientRect();
          point.x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
          point.y = clamp((event.clientY - rect.top) / rect.height, 0, 1);
          point.wordIndex = findNearestWordIndex(line, point.x * rect.width, rect);
          line.pitchPoints.sort(function (a, b) { return a.x - b.x; });
          syncWordPitchFromPoints(line); redrawPitchLine(line.lineIndex);
        }
        if (activeBreathDrag && drawMode === 'breath') {
          const line = lines.find(function (l) { return l.lineIndex === activeBreathDrag.lineIndex; });
          if (!line) return;
          const breath = line.breaths.find(function (b) { return b.id === activeBreathDrag.breathId; });
          if (!breath) return;
          const rect = line.flow.getBoundingClientRect();
          breath.slot = findBreathSlot(line, clamp(event.clientX - rect.left, 0, rect.width), rect);
          renderLineFlow(line);
        }
      });
      document.addEventListener("keydown", function (event) { if (event.key === "Escape") setDrawMode(drawMode); });

      window.addEventListener("resize", function () { redrawAllPitchLines(); renderAllLineFlows(); });

      generateBtn.addEventListener("click", generateMap);
      editLyricsBtn.addEventListener("click", editLyrics);
      exportBtn.addEventListener("click", exportMap);
      clearMapBtn.addEventListener("click", clearMap);
      document.getElementById("applyAbovePresetBtn").addEventListener("click", function () { applyAboveValue(aboveSelect.value); });
      document.getElementById("applyCustomAboveBtn").addEventListener("click", function () { applyAboveValue(customAbove.value); });
      document.getElementById("applyBelowPresetBtn").addEventListener("click", function () { applyBelowValue(belowSelect.value); });
      document.getElementById("applyCustomBelowBtn").addEventListener("click", function () { applyBelowValue(customBelow.value); });
      document.getElementById("clearSelectedBtn").addEventListener("click", clearSelectedMarkings);
      document.getElementById("applyWordEditBtn").addEventListener("click", applyWordEdit);
      enuncModeBtn.addEventListener("click", function () { setDrawMode("enunciation"); });
      pitchModeBtn.addEventListener("click", function () { setDrawMode("pitch"); });
      breathModeBtn.addEventListener("click", function () { setDrawMode("breath"); });
      volumeModeBtn.addEventListener("click", function () { setDrawMode("volume"); });

      renderEmpty("Paste lyrics and click “Generate Song Map”.");
    })();
  </script>
</body>
</html>
